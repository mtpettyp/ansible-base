---
driver:
  name: docker
platforms:
  - name: ubuntu-jammy-base
    image: ubuntu:22.04
    dockerfile: Dockerfile.j2
    privileged: true
    published_ports:
      - 0.0.0.0:8022:22/tcp
    command: "/sbin/init"
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
verifier:
  name: testinfra
  options:
    s: true
scenario:
  name: default
  create_sequence:
    - create
  check_sequence:
    - destroy
    - create
    - converge
    - check
    - destroy
  converge_sequence:
    - create
    - converge
  destroy_sequence:
    - destroy
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy